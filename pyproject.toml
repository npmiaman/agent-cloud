[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcloud"
version = "0.9.0"
description = "Self-hosted, open-source cloud workspaces for AI agents: identity, files, versions, permissions, approvals and audit, over MCP."
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["ai-agents", "mcp", "model-context-protocol", "storage", "self-hosted", "llm", "agent-memory", "provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Archiving :: Backup",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
fast = ["uvloop>=0.19", "httptools>=0.6"]
vector = ["numpy>=1.26"]                       # faster HNSW (pure-Python fallback without it)
local-embeddings = ["numpy>=1.26", "sentence-transformers>=3"]   # optional: run an embedding model on this server
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/npmiaman/agent-cloud"
Documentation = "https://github.com/npmiaman/agent-cloud/tree/main/docs"
Issues = "https://github.com/npmiaman/agent-cloud/issues"
Changelog = "https://github.com/npmiaman/agent-cloud/blob/main/CHANGELOG.md"

[project.scripts]
agentcloud = "agentcloud_server.cli:main"
ac = "agentcloud.cli:entry"

[tool.setuptools]
packages = ["agentcloud_server", "agentcloud"]
package-dir = { "agentcloud_server" = "agentcloud_server", "agentcloud" = "sdk/python/agentcloud" }

[tool.setuptools.package-data]
agentcloud_server = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["sdk/typescript"]

[tool.ruff.lint]
select = ["E9", "F"]
