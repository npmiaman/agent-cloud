[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcloud"
version = "0.5.0"
description = "Self-hosted, open-source cloud workspaces for AI agents: identity, files, versions, permissions, approvals and audit, over MCP."
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["ai-agents", "mcp", "storage", "self-hosted", "llm"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
fast = ["uvloop>=0.19", "httptools>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
agentcloud = "agentcloud_server.cli:main"
ac = "agentcloud.cli:entry"

[tool.setuptools]
packages = ["agentcloud_server", "agentcloud"]
package-dir = { "agentcloud_server" = "agentcloud_server", "agentcloud" = "sdk/python/agentcloud" }

[tool.setuptools.package-data]
agentcloud_server = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
