<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Cloud</title>
<style>
:root{
  --bg:#ffffff;--side:#f7f7f8;--panel:#ffffff;--raise:#ffffff;--ink:#0d0d0d;--ink2:#3f3f46;--mute:#71717a;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.12);
  --hover:rgba(0,0,0,.04);--sel:rgba(0,0,0,.065);--acc:#6d4aff;--acc-soft:rgba(109,74,255,.08);--pri:#0d0d0d;--pri-ink:#ffffff;
  --ok:#0f9d76;--warn:#c2410c;--bad:#dc2626;--code:#f6f6f7;--shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px rgba(16,24,40,.07);--overlay:rgba(250,250,250,.6)}
:root[data-theme="dark"]{
  --bg:#212121;--side:#171717;--panel:#262626;--raise:#2f2f2f;--ink:#ececec;--ink2:#d4d4d4;--mute:#a1a1aa;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --hover:rgba(255,255,255,.06);--sel:rgba(255,255,255,.10);--acc:#a594ff;--acc-soft:rgba(165,148,255,.14);--pri:#ececec;--pri-ink:#171717;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--code:#1c1c1c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--overlay:rgba(0,0,0,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#212121;--side:#171717;--panel:#262626;--raise:#2f2f2f;--ink:#ececec;--ink2:#d4d4d4;--mute:#a1a1aa;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --hover:rgba(255,255,255,.06);--sel:rgba(255,255,255,.10);--acc:#a594ff;--acc-soft:rgba(165,148,255,.14);--pri:#ececec;--pri-ink:#171717;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--code:#1c1c1c;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--overlay:rgba(0,0,0,.55)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink);cursor:pointer;text-decoration:none;text-underline-offset:3px}
main a:not(.btn):not(.card):not(.chip){color:var(--acc)}main a:not(.btn):not(.card):not(.chip):hover{text-decoration:underline}
code,pre,.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-size:12.5px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
::selection{background:var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- shell */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);height:100vh}
.app.collapsed{grid-template-columns:minmax(0,1fr)}
.app.collapsed aside{display:none}
aside{background:var(--side);display:flex;flex-direction:column;height:100vh;overflow:hidden;border-right:1px solid var(--line)}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 6px 14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15.5px;letter-spacing:-.01em;color:var(--ink)}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#38bdf8);display:grid;place-items:center;color:#fff}
.logo svg.i{width:15px;height:15px;stroke-width:2.2}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;cursor:pointer;color:var(--mute)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.side-scroll{flex:1;overflow-y:auto;padding:4px 8px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink2);font-size:14px;width:100%;border:0;background:none;cursor:pointer;text-align:left;white-space:nowrap}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-item.on{background:var(--sel);color:var(--ink);font-weight:550}
.nav-item .grow{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-item .kbd{margin-left:auto}
.nav-cta{margin:6px 0 10px;font-weight:550;color:var(--ink)}
.navh{font-size:12px;color:var(--mute);padding:14px 10px 4px;display:flex;align-items:center;justify-content:space-between}
.dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:650;color:#fff;flex:none}
.count{font-size:11.5px;font-weight:600;background:var(--acc);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.side-foot{padding:8px;border-top:1px solid var(--line)}
.acct{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;text-align:left}
.acct:hover{background:var(--hover)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:650;font-size:13px;flex:none}
.acct .who{min-width:0;flex:1}.acct .who b{display:block;font-size:13.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .who span{display:block;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:fixed;z-index:30;background:var(--raise);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:240px;animation:pop .12s ease-out}
.menu .nav-item{font-size:13.5px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.menu .label{font-size:12px;color:var(--mute);padding:6px 10px 2px}
.seg{display:flex;gap:2px;background:var(--hover);border-radius:10px;padding:3px;margin:4px 6px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:5px 6px;font-size:12.5px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.workarea{height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.topbar .crumb{font-weight:550;color:var(--ink2);font-size:14.5px}
.search-pill{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 8px 6px 12px;color:var(--mute);cursor:pointer;min-width:220px;font-size:13.5px}
.search-pill:hover{border-color:var(--line2);color:var(--ink2)}
.kbd{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--mute);font-family:inherit;line-height:18px}
main{width:100%;max-width:1120px;margin:0 auto;padding:8px 32px 64px;min-width:0;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* ---------- type & layout */
h1{font-size:28px;line-height:1.2;margin:18px 0 6px;letter-spacing:-.025em;font-weight:650}
h2{font-size:16px;margin:30px 0 12px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 24px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--mute)}.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
a.card.stat{color:var(--ink);transition:border-color .15s,transform .15s}a.card.stat:hover{border-color:var(--line2);transform:translateY(-1px)}
.stat .n{font-size:26px;font-weight:650;letter-spacing:-.03em}.stat .l{color:var(--mute);font-size:13px}
.stat .ic{width:32px;height:32px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;margin-bottom:10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- controls */
.btn{border:1px solid var(--line2);background:var(--panel);padding:7px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}.btn.p:hover{opacity:.88;background:var(--pri)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}.btn.bad:hover{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:4px 11px;font-size:12.5px}
input,select,textarea{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:9px 12px;max-width:100%;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px;padding:0}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:0 8px;font-size:11.5px;margin-right:5px;color:var(--mute);background:var(--hover);line-height:19px}
.badge{background:var(--acc);color:#fff;border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:600;line-height:18px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--ink2);cursor:pointer;transition:background .12s,border-color .12s}
.chip:hover{background:var(--hover);border-color:var(--line2);color:var(--ink)}
.chip svg.i{width:16px;height:16px;color:var(--mute)}

/* ---------- tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--mute);font-size:12.5px;background:transparent}
tr:last-child td{border-bottom:0}
tbody tr:hover td,table tr:not(:first-child):hover td{background:var(--hover)}
tr.click{cursor:pointer}
table.prev td,table.prev th{font-size:12.5px;padding:6px 10px}

/* ---------- content blocks */
pre.view{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;max-height:460px;margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.diff .a{color:var(--ok)}.diff .d{color:var(--bad)}.diff .h{color:var(--mute)}
.notice{border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);background:var(--acc-soft);padding:14px 16px;border-radius:14px;margin:12px 0}
.secret{background:var(--code);border:1px dashed var(--line2);padding:10px 12px;border-radius:10px;word-break:break-all;user-select:all}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:18px;text-align:center;color:var(--mute);cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.scroll{overflow:auto;max-height:460px}
img.prev{max-width:100%;border-radius:12px;background:var(--code)}
.bar{height:6px;background:var(--hover);border-radius:999px;overflow:hidden;min-width:80px}.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--pri-ink);padding:10px 18px;border-radius:999px;max-width:min(520px,calc(100vw - 32px));z-index:50;box-shadow:var(--shadow);font-size:14px;animation:pop .15s ease-out}
.skel{background:linear-gradient(90deg,var(--hover) 25%,var(--sel) 50%,var(--hover) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- home */
.hero{max-width:760px;margin:9vh auto 0;text-align:center}
.hero h1{font-size:34px;margin:0 0 8px}
.composer{margin:26px auto 14px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:28px;padding:10px 10px 10px 20px;box-shadow:var(--shadow);text-align:left}
.composer:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft),var(--shadow)}
.composer input{flex:1;border:0;background:transparent;padding:10px 0;font-size:16px;box-shadow:none}
.composer input:focus{box-shadow:none}
.send{width:38px;height:38px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.3;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.results{text-align:left;margin-top:14px}
.result{display:block;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;color:var(--ink)}
.result:hover{border-color:var(--line2)}
.result .snip{color:var(--mute);font-size:13px;margin-top:3px}
.feed{display:flex;flex-direction:column}
.feed-row{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.feed-row:last-child{border-bottom:0}

/* ---------- login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:380px}
.login .logo{width:44px;height:44px;border-radius:14px;margin:0 auto 18px}.login .logo svg.i{width:22px;height:22px}
.login h1{text-align:center;font-size:28px;margin:0 0 6px}
.login .sub{text-align:center}
.login input{width:100%;padding:12px 14px}
.login .btn.p{width:100%;justify-content:center;padding:12px;margin-top:18px;font-size:15px}

/* ---------- command palette */
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;animation:fade .12s ease-out}
.palette{width:min(640px,calc(100vw - 32px));background:var(--raise);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;animation:pop .14s ease-out}
.palette .pin{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.palette .pin input{flex:1;border:0;background:transparent;padding:4px 0;font-size:16px}
.palette .pin input:focus{box-shadow:none}
.palette .list{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.palette .grp{font-size:12px;color:var(--mute);padding:10px 12px 4px}
.palette .opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--ink2)}
.palette .opt .meta{margin-left:auto;font-size:12px;color:var(--mute);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette .opt.on{background:var(--sel);color:var(--ink)}
.palette .foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}

/* ---------- developer console */
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.step{display:flex;gap:14px;padding:12px 18px;border-top:1px solid var(--line)}
.step .tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mute);flex:none;margin-top:1px}
.step.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done .st{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line2)}
.step .st{font-weight:550}
.cmd{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 12px}
.cmd code{flex:1;overflow-x:auto;white-space:nowrap;font-size:12.5px}
.copy{border:1px solid var(--line2);background:var(--panel);border-radius:7px;font-size:11.5px;padding:2px 8px;cursor:pointer;color:var(--mute);flex:none}
.copy:hover{color:var(--ink);border-color:var(--ink)}
.idchip{display:inline-flex;align-items:center;gap:8px}
.card.stat.mini{padding:14px}.card.stat.mini .n{font-size:21px}
table.dense td,table.dense th{padding:7px 12px;font-size:13px}
table.dense tr.detail td{background:var(--code)}
.ev{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.ev.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.ev.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.ev.dim{background:var(--hover);color:var(--mute)}
.live{font-size:12px;color:var(--ok);animation:blink 2s infinite}@keyframes blink{50%{opacity:.35}}
.kv{padding:6px 18px}.kvr{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}.kvr:last-child{border-bottom:0}
.oss{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);padding:4px 10px 8px}.oss a{color:var(--mute)}.oss a:hover{color:var(--ink)}

/* ---------- responsive */
.only-mobile{display:none}
.scrim{display:none}
@media (max-width:860px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .app.collapsed aside{display:flex}
  aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:35;transform:translateX(-100%);transition:transform .2s ease;visibility:visible!important;box-shadow:var(--shadow)}
  .app.open aside{transform:none}
  .scrim{position:fixed;inset:0;background:var(--overlay);z-index:34;display:none}.app.open .scrim{display:block}
  .only-mobile{display:inline-grid}.only-desktop{display:none}
  .search-pill{min-width:0}.search-pill .txt,.search-pill .kbd{display:none}
  main{padding:4px 16px 48px}.split,.cols{grid-template-columns:1fr}
  h1{font-size:24px}.hero{margin-top:4vh}.hero h1{font-size:27px}
}
</style>
</head>

// ---------------------------------------------------------------- uploads (verified session for large files)
async function sha256Hex(blob) {
  const buf = await crypto.subtle.digest("SHA-256", await blob.arrayBuffer());
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function sessionUpload(ws, path, file) {
  const sum = await sha256Hex(file);
  const s = await api("POST", `/v1/workspaces/${ws.id}/uploads`, { path, size_bytes: file.size, content_type: file.type || null, checksum_sha256: sum });
  const put = await fetch(s.upload_url, { method: "PUT", body: file });
  if (!put.ok) throw new Error(await errText(put));
  const done = await api("POST", `/v1/uploads/${s.upload_id}/complete`, { checksum_sha256: sum });
  return done.result;
}

  async function hookTable() {
    const hs = await api("GET", "/v1/webhooks");
    if (!hs.length) return h("p", { class: "muted" }, "No webhooks yet.");
    return tbl(h("tr", {}, ["Endpoint", "Events", "Last delivery", ""].map(t => h("th", {}, t))),
      hs.map(w => { const last = w.last_delivery; const deliveries = h("div");
        return [h("tr", {}, h("td", { class: "mono" }, w.url, h("div", { class: "muted", style: "font-size:11.5px" }, w.id)), h("td", { class: "mono" }, w.events.join(", ")),
          h("td", {}, last ? h("span", { class: last.status === "delivered" ? "ok-t" : last.status === "failed" ? "bad-t" : "warn-t" }, `${last.status}${last.response_code ? " · " + last.response_code : ""}`) : h("span", { class: "muted" }, "none yet")),
          h("td", {}, h("div", { class: "acts" },
            h("button", { class: "btn sm", onclick: guard(async () => { await api("POST", `/v1/webhooks/${w.id}/test`); toast("Ping queued; it arrives within a second or two."); setTimeout(() => render(), 2500); }) }, "Send test"),
            h("button", { class: "btn sm", onclick: guard(async () => {
              const ds = await api("GET", `/v1/webhooks/${w.id}/deliveries?limit=20`);
              deliveries.replaceChildren(ds.length ? h("table", { class: "dense" }, ds.map(d => h("tr", {}, h("td", { class: "mono muted" }, clock(d.created_at)), h("td", { class: "mono" }, d.event),
                h("td", {}, h("span", { class: d.status === "delivered" ? "ok-t" : d.status === "failed" ? "bad-t" : "warn-t" }, d.status)), h("td", { class: "muted" }, `${d.attempts} attempt(s)${d.response_code ? " · HTTP " + d.response_code : ""}${d.error ? " · " + d.error : ""}`))))
                : h("p", { class: "muted" }, "No deliveries yet."));
            }) }, "Deliveries"),
            h("button", { class: "btn sm bad", onclick: guard(async () => { if (!confirm("Remove this webhook?")) return; await api("DELETE", "/v1/webhooks/" + w.id); render(); }) }, "Remove")))),
          h("tr", {}, h("td", { colspan: 4, style: "padding:0 14px" }, deliveries))]; }).flat());
  }
  const list = h("div", {}, await hookTable());
  return [h("h1", {}, "Webhooks"), h("p", { class: "sub" }, "Signed POSTs when things happen: route approval requests to Slack, page someone on deletes, sync your own systems."),
    form, out, h("div", { style: "height:14px" }), list,
    h("h2", {}, "Verifying signatures"),
    h("p", { class: "muted" }, "Each request has X-AgentCloud-Signature: t=<unix>,v1=<hex>. Compute HMAC-SHA256(secret, \"<t>.<raw body>\") and compare; reject timestamps older than 5 minutes."),
    h("pre", { class: "view" }, `from agentcloud_server.webhooks import verify\nok = verify(secret, request.body, request.headers["X-AgentCloud-Signature"])`),
    h("p", { class: "muted" }, "Events: approval.created · approval.approved · approval.rejected · file.created · file.modified · file.deleted · file.restored · file.moved · permission.changed · credential.created · credential.revoked · credential.rotated · agent.provisioned · …")];
}
