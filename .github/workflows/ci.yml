name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e .
      - run: cd sdk/typescript && npx -y -p typescript@5.6.3 tsc
      - name: e2e against a live server
        run: |
          agentcloud up --data /tmp/ac --port 8799 --workers 1 &
          for i in $(seq 1 50); do curl -sf localhost:8799/healthz && break; sleep 0.2; done
          cd sdk/typescript && node test/e2e.mjs
