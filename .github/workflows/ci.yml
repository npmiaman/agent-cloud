name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  s3-conformance:
    name: s3 conformance (S3 API server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" "moto[server]>=5.1"
      - name: start an S3 API server (moto in server mode, a separate process)
        run: |
          moto_server -p 5055 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:5055 && break; sleep 0.5; done
      - name: core tests over HTTP, including concurrent compare-and-swap
        env:
          AGENTCLOUD_TEST_S3_ENDPOINT: http://localhost:5055
        run: pytest -q tests/core -rs
      - if: failure()
        run: tail -100 /tmp/moto.log

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: pip install -e .
      - run: cd sdk/typescript && npx -y -p typescript@5.6.3 tsc
      - name: e2e against a live server
        run: |
          agentcloud up --data /tmp/ac --port 8799 --workers 1 &
          for i in $(seq 1 50); do curl -sf localhost:8799/healthz && break; sleep 0.2; done
          cd sdk/typescript && node test/e2e.mjs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t agentcloud:ci .
      - name: smoke test
        run: |
          docker run -d --name ac -p 8787:8787 agentcloud:ci
          for i in $(seq 1 60); do curl -sf localhost:8787/healthz && break; sleep 0.5; done
          curl -sf localhost:8787/readyz
          curl -sf localhost:8787/llms.txt | head -3
          docker logs ac
