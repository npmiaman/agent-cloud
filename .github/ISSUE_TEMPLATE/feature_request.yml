name: Feature request
description: Suggest something agents or operators need.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you or your agents trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API, MCP tool, or behaviour you'd like. New MCP tools need a strong reason; say why an existing one can't do it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
