name: Bug report
description: Something doesn't work the way the docs say it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues go through private vulnerability reporting, not here** (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest set of commands, API calls or MCP tool calls that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show agentcloud | grep Version`, or the commit SHA.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [MCP, REST API, Python SDK, TypeScript SDK, agentcloud CLI, ac CLI, Console, Memory tool backend, Other]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client (if relevant)
      placeholder: Claude Code 2.x, Cursor, custom (protocol 2026-07-28) ...
  - type: textarea
    id: logs
    attributes:
      label: Logs and `agentcloud status`
      description: Include the request_id from any error response. Remove credentials (aca_, acx_, acu_, acs_ tokens).
      render: text
